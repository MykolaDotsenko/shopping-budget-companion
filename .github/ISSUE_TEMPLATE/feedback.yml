name: Feedback
description: Tell us what worked, what didn't, or what you would change.
title: "Feedback: "
body:
  - type: markdown
    attributes:
      value: Thanks for trying Shopping Budget Companion. This page is public, so please leave out personal details.
  - type: textarea
    id: feedback
    attributes:
      label: What happened, or what would you change?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and browser
      placeholder: e.g. iPhone 13 with Safari
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the bottom of the start screen.
      placeholder: e.g. v2.0.0
