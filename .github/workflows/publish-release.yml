name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact package SemVer without v, for example 2.0.0"
        required: true
        type: string
      quality_run_id:
        description: "Successful main Quality push run ID for the exact source SHA"
        required: true
        type: string
      source_sha:
        description: "Exact lowercase 40-character current main SHA"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Fetch release evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_RUN_ID: ${{ inputs.quality_run_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-contract

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${QUALITY_RUN_ID}" \
            > /tmp/release-contract/run.json

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${QUALITY_RUN_ID}/artifacts?per_page=100" \
            > /tmp/release-contract/artifacts.json

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            > /tmp/release-contract/main-ref.json

      - name: Validate exact tested release contract
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          QUALITY_RUN_ID: ${{ inputs.quality_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          export MAIN_SHA="$(jq -r '.object.sha' /tmp/release-contract/main-ref.json)"
          node scripts/validate-release-contract.mjs \
            /tmp/release-contract/run.json \
            /tmp/release-contract/artifacts.json \
            package.json \
            /tmp/release-contract/release-manifest.json

      - name: Reject an existing tag or release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Release tag already exists: ${TAG}" >&2
            exit 1
          fi

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub Release already exists: ${TAG}" >&2
            exit 1
          fi

      - name: Download exact tested Pages artifact archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-assets
          artifact_id="$(jq -r '.pagesSite.artifactId' /tmp/release-contract/release-manifest.json)"
          expected_digest="$(jq -r '.pagesSite.digest' /tmp/release-contract/release-manifest.json)"

          curl --fail-with-body --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            --output "/tmp/release-assets/pages-site-${SOURCE_SHA}.zip"

          actual_digest="sha256:$(sha256sum "/tmp/release-assets/pages-site-${SOURCE_SHA}.zip" | awk '{print $1}')"
          test "${actual_digest}" = "${expected_digest}"

      - name: Download exact SBOM evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-${{ inputs.source_sha }}
          path: /tmp/release-assets
          github-token: ${{ github.token }}
          run-id: ${{ inputs.quality_run_id }}

      - name: Download exact Android APK evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-apk-${{ inputs.source_sha }}
          path: /tmp/android-apk
          github-token: ${{ github.token }}
          run-id: ${{ inputs.quality_run_id }}

      - name: Verify Android APK build evidence
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          cd /tmp/android-apk
          sha256sum --check SHA256SUMS

          jq -e \
            --arg version "${VERSION}" \
            --arg sha "${SOURCE_SHA}" \
            '.schemaVersion == 1 and
             .version == $version and
             .sourceSha == $sha and
             .targetApi == 36 and
             .minApi == 24 and
             .applicationId == "io.github.mykoladotsenko.shoppingbudgetcompanion" and
             .previewSigned == true and
             .releaseSigned == false' \
            android-build-manifest.json >/dev/null

          test -f "shopping-budget-companion-${VERSION}-release-unsigned.apk"

      - name: Set up JDK 17 for APK signing
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android signing tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ""

      - name: Install pinned Android build tools
        run: sdkmanager "build-tools;36.0.0"

      - name: Sign exact tested Android release APK
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            test -n "${!name}" || {
              echo "Missing required Android release-signing secret: ${name}" >&2
              exit 1
            }
          done

          KEYSTORE="/tmp/android-release.keystore"
          UNSIGNED="/tmp/android-apk/shopping-budget-companion-${VERSION}-release-unsigned.apk"
          ALIGNED="/tmp/android-release-aligned.apk"
          SIGNED="/tmp/release-assets/shopping-budget-companion-${VERSION}.apk"

          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE}"
          chmod 600 "${KEYSTORE}"

          "${ANDROID_SDK_ROOT}/build-tools/36.0.0/zipalign" -f -p 4 \
            "${UNSIGNED}" "${ALIGNED}"

          "${ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner" sign \
            --ks "${KEYSTORE}" \
            --ks-key-alias "${ANDROID_KEY_ALIAS}" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "${SIGNED}" \
            "${ALIGNED}"

          "${ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "${SIGNED}"

          sha256sum "${SIGNED}" > "${SIGNED}.sha256"
          rm -f "${KEYSTORE}" "${ALIGNED}"

      - name: Verify release evidence files
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          cd /tmp/release-assets
          sha256sum --check "shopping-budget-companion-${SOURCE_SHA}.cdx.json.sha256"
          sha256sum --check "shopping-budget-companion-${VERSION}.apk.sha256"

          APK_SHA256="$(sha256sum "shopping-budget-companion-${VERSION}.apk" | awk '{print $1}')"
          jq \
            --arg file "shopping-budget-companion-${VERSION}.apk" \
            --arg digest "sha256:${APK_SHA256}" \
            '. + {
              androidRelease: {
                file: $file,
                digest: $digest,
                applicationId: "io.github.mykoladotsenko.shoppingbudgetcompanion",
                targetApi: 36
              }
            }' \
            /tmp/release-contract/release-manifest.json \
            > ./release-manifest.json

      - name: Create draft release from exact main SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          flags=(
            --repo "${GITHUB_REPOSITORY}"
            --target "${SOURCE_SHA}"
            --title "Shopping Budget Companion ${TAG}"
            --draft
            --generate-notes
          )

          if [[ "${VERSION}" == *-* ]]; then
            flags+=(--prerelease)
          fi

          gh release create "${TAG}" /tmp/release-assets/* "${flags[@]}"

      - name: Verify draft release identity and evidence assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"

          gh release view "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json tagName,targetCommitish,isDraft,assets \
            > /tmp/release-contract/published-draft.json

          jq -e --arg tag "${TAG}" --arg sha "${SOURCE_SHA}" '
            .tagName == $tag and
            .targetCommitish == $sha and
            .isDraft == true and
            ([.assets[].name] | index("release-manifest.json") != null) and
            ([.assets[].name] | index("pages-site-" + $sha + ".zip") != null) and
            ([.assets[].name] | index("shopping-budget-companion-" + $sha + ".cdx.json") != null) and
            ([.assets[].name] | index("shopping-budget-companion-" + $sha + ".cdx.json.sha256") != null) and
            ([.assets[].name] | index("shopping-budget-companion-" + .tagName[1:] + ".apk") != null) and
            ([.assets[].name] | index("shopping-budget-companion-" + .tagName[1:] + ".apk.sha256") != null)
          ' /tmp/release-contract/published-draft.json >/dev/null

      - name: Publish verified release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft \
            --jq 'select(.isDraft == false)' >/dev/null
