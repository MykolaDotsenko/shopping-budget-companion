name: Publish Study Baseline

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: "Immutable URL slug, for example evidence-baseline-2026-09-25-r9"
        required: true
        type: string
      quality_run_id:
        description: "Successful main Quality workflow run ID that produced the tested pages-site artifact"
        required: true
        type: string
      source_sha:
        description: "Exact 40-character main commit SHA for that Quality run"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false
  queue: max

jobs:
  publish-study-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Validate immutable baseline inputs and source run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE: ${{ inputs.baseline }}
          QUALITY_RUN_ID: ${{ inputs.quality_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail

          [[ "${BASELINE}" =~ ^[a-z0-9][a-z0-9._-]{0,63}$ ]] || {
            echo "Invalid baseline slug: ${BASELINE}" >&2
            exit 1
          }

          [[ "${QUALITY_RUN_ID}" =~ ^[0-9]+$ ]] || {
            echo "quality_run_id must be numeric" >&2
            exit 1
          }

          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "source_sha must be a lowercase full Git SHA" >&2
            exit 1
          }

          run_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${QUALITY_RUN_ID}")"

          jq -e --arg sha "${SOURCE_SHA}" '
            .name == "Quality" and
            .event == "push" and
            .head_branch == "main" and
            .head_sha == $sha and
            .status == "completed" and
            .conclusion == "success"
          ' <<<"${run_json}" >/dev/null

      - name: Download exact tested pages-site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pages-site
          path: /tmp/pages-site
          github-token: ${{ github.token }}
          run-id: ${{ inputs.quality_run_id }}

      - name: Validate relocatable study surfaces
        shell: bash
        run: |
          set -euo pipefail

          for route in qa beta cohort; do
            test -f "/tmp/pages-site/${route}/index.html"
            test ! -e "/tmp/pages-site/${route}/manifest.webmanifest"
            test ! -e "/tmp/pages-site/${route}/sw.js"

            if grep -Eq '(src|href)="/shopping-budget-companion/' "/tmp/pages-site/${route}/index.html"; then
              echo "Study surface is not relocatable: ${route}" >&2
              exit 1
            fi
          done

      - name: Checkout deployment branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Publish immutable study baseline
        shell: bash
        env:
          BASELINE: ${{ inputs.baseline }}
          QUALITY_RUN_ID: ${{ inputs.quality_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail

          target="study/${BASELINE}"

          if [ -e "${target}" ]; then
            echo "Immutable study baseline already exists: ${target}" >&2
            exit 1
          fi

          mkdir -p "${target}"

          for route in qa beta cohort; do
            cp -R "/tmp/pages-site/${route}" "${target}/${route}"
          done

          cat > "${target}/study-baseline.json" <<EOF
          {
            "schemaVersion": 1,
            "baseline": "${BASELINE}",
            "sourceSha": "${SOURCE_SHA}",
            "qualityRunId": ${QUALITY_RUN_ID}
          }
          EOF

          cat > "${target}/index.html" <<EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <meta name="robots" content="noindex,nofollow,noarchive" />
              <title>Shopping Budget Companion — Study ${BASELINE}</title>
            </head>
            <body>
              <main>
                <h1>Shopping Budget Companion — immutable study baseline</h1>
                <p><strong>Baseline:</strong> ${BASELINE}</p>
                <p><strong>Source SHA:</strong> <code>${SOURCE_SHA}</code></p>
                <p><strong>Quality run:</strong> <code>${QUALITY_RUN_ID}</code></p>
                <ul>
                  <li><a href="./qa/">Timing QA</a></li>
                  <li><a href="./beta/">Retention beta</a></li>
                  <li><a href="./cohort/">Retention cohort analyzer</a></li>
                </ul>
              </main>
            </body>
          </html>
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${target}"
          git commit -m "study: publish immutable baseline ${BASELINE} (${SOURCE_SHA})"
          git push origin HEAD:gh-pages
