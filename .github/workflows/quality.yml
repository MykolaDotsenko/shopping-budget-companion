name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  VITE_SHOPPING_BARCODE_SCANNER: ${{ vars.VITE_SHOPPING_BARCODE_SCANNER }}
  VITE_SHOPPING_PRODUCT_LOOKUP: ${{ vars.VITE_SHOPPING_PRODUCT_LOOKUP }}
  VITE_SHOPPING_PRICE_OCR: ${{ vars.VITE_SHOPPING_PRICE_OCR }}
  VITE_SHOPPING_VISUAL_RECOGNITION: ${{ vars.VITE_SHOPPING_VISUAL_RECOGNITION }}

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      pages_site_digest: ${{ steps.upload-pages-site.outputs.artifact-digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.52.0

      - name: Generate production CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          SBOM_FILE="shopping-budget-companion-${GITHUB_SHA}.cdx.json"

          "${{ steps.syft.outputs.cmd }}" dir:. \
            --select-catalogers '-github-actions-usage-cataloger,-github-action-workflow-usage-cataloger' \
            --source-name shopping-budget-companion \
            --source-version "$(jq -r .version package.json)" \
            -o "cyclonedx-json=${SBOM_FILE}"

          sha256sum "${SBOM_FILE}" > "${SBOM_FILE}.sha256"

      - name: Validate production CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          SBOM_FILE="shopping-budget-companion-${GITHUB_SHA}.cdx.json"

          echo "Validate CycloneDX envelope"
          jq -e '.bomFormat == "CycloneDX"' "${SBOM_FILE}" >/dev/null
          jq -e '.specVersion | type == "string"' "${SBOM_FILE}" >/dev/null

          echo "Validate product source identity"
          jq -e '.metadata.component.name == "shopping-budget-companion"' "${SBOM_FILE}" >/dev/null
          jq -e --arg version "$(jq -r .version package.json)" \
            '.metadata.component.version == $version' "${SBOM_FILE}" >/dev/null

          echo "Validate runtime dependency inventory"
          jq -e '.components | type == "array" and length > 0' "${SBOM_FILE}" >/dev/null

          while IFS= read -r dependency; do
            echo "Require runtime dependency: ${dependency}"
            jq -e --arg dependency "${dependency}" \
              'any(.components[]; .name == $dependency)' \
              "${SBOM_FILE}" >/dev/null
          done < <(jq -r '.dependencies | keys[]' package.json)

          echo "Reject development-only test packages"
          jq -e 'all(.components[]; .name != "vitest" and .name != "@vitest/coverage-v8")' \
            "${SBOM_FILE}" >/dev/null

          echo "Reject GitHub Actions from product SBOM"
          jq -e '[.components[] | select((.purl // "") | startswith("pkg:github/"))] | length == 0' \
            "${SBOM_FILE}" >/dev/null

          echo "Verify SHA-256 sidecar"
          sha256sum --check "${SBOM_FILE}.sha256"

      - name: Upload SBOM evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: |
            shopping-budget-companion-${{ github.sha }}.cdx.json
            shopping-budget-companion-${{ github.sha }}.cdx.json.sha256
          if-no-files-found: warn
          retention-days: 30

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run static, unit and component quality gates
        run: npm run check

      - name: Verify a build with the camera features switched off
        env:
          VITE_SHOPPING_BARCODE_SCANNER: "0"
          VITE_SHOPPING_PRICE_OCR: "0"
          VITE_SHOPPING_VISUAL_RECOGNITION: "0"
        run: |
          npm run build
          npm run build:check

      - name: Build public release artifact
        run: |
          rm -rf dist dist-* site
          npm run build -- --base=/shopping-budget-companion/
          npm run build:check

      - name: Build guarded shopping timing QA
        env:
          VITE_SHOPPING_QA_TIMING: "1"
          VITE_EVIDENCE_BUILD_REVISION: ${{ github.sha }}
        run: |
          npm run build -- --base=./ --outDir=dist-qa
          npm run qa:prepare-index

      - name: Build guarded retention beta
        env:
          VITE_SHOPPING_BETA_EVIDENCE: "1"
          VITE_EVIDENCE_BUILD_REVISION: ${{ github.sha }}
        run: |
          npm run build -- --base=./ --outDir=dist-beta
          npm run beta:prepare-index

      - name: Build local retention cohort analyzer
        env:
          VITE_SHOPPING_COHORT_ANALYSIS: "1"
          VITE_EVIDENCE_BUILD_REVISION: ${{ github.sha }}
        run: |
          npm run build -- --base=./ --outDir=dist-cohort
          npm run cohort:prepare-index

      - name: Validate guarded builds are relocatable
        shell: bash
        run: |
          set -euo pipefail
          for dir in dist-qa dist-beta dist-cohort; do
            test -f "${dir}/index.html"
            test ! -e "${dir}/manifest.webmanifest"
            test ! -e "${dir}/sw.js"
            if grep -Eq '(src|href)="/shopping-budget-companion/' "${dir}/index.html"; then
              echo "Guarded build is not relocatable: ${dir}" >&2
              exit 1
            fi
          done

      - name: Stage immutable site artifact
        run: |
          mkdir -p site/qa site/beta site/cohort
          cp -R dist/. site/
          cp -R dist-qa/. site/qa/
          cp -R dist-beta/. site/beta/
          cp -R dist-cohort/. site/cohort/
          touch site/.nojekyll
          test ! -e site/node_modules
          test ! -e site/package.json
          test ! -e site/package-lock.json
          test ! -e site/src
          test ! -e site/tests

      - name: Upload tested site artifact
        id: upload-pages-site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-site
          path: site
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  provenance:
    needs: quality
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download exact SBOM evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-${{ github.sha }}
          path: /tmp/sbom

      - name: Verify SBOM digest before attestation
        shell: bash
        working-directory: /tmp/sbom
        run: sha256sum --check "shopping-budget-companion-${GITHUB_SHA}.cdx.json.sha256"

      - name: Attest exact pages-site build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: pages-site
          subject-digest: sha256:${{ needs.quality.outputs.pages_site_digest }}

      - name: Attest production SBOM to exact pages-site artifact
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: pages-site
          subject-digest: sha256:${{ needs.quality.outputs.pages_site_digest }}
          sbom-path: /tmp/sbom/shopping-budget-companion-${{ github.sha }}.cdx.json

      - name: Verify attestation outputs
        shell: bash
        env:
          PROVENANCE_URL: ${{ steps.provenance.outputs.attestation-url }}
          PROVENANCE_ID: ${{ steps.provenance.outputs.attestation-id }}
          SBOM_URL: ${{ steps.sbom-attestation.outputs.attestation-url }}
          SBOM_ID: ${{ steps.sbom-attestation.outputs.attestation-id }}
        run: |
          set -euo pipefail
          test -n "${PROVENANCE_URL}"
          test -n "${PROVENANCE_ID}"
          test -n "${SBOM_URL}"
          test -n "${SBOM_ID}"

  artifact-integrity:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pages-site
          path: /tmp/pages-site

      - name: Verify release artifact contents
        shell: bash
        run: |
          set -euo pipefail
          site=/tmp/pages-site

          for file in index.html .nojekyll manifest.webmanifest sw.js pwa-icon-192.png pwa-icon-512.png; do
            test -f "${site}/${file}"
          done

          for surface in qa beta cohort; do
            test -f "${site}/${surface}/index.html"
            test ! -e "${site}/${surface}/manifest.webmanifest"
            test ! -e "${site}/${surface}/sw.js"
          done

          for path in node_modules package.json package-lock.json src tests study; do
            test ! -e "${site}/${path}"
          done

          test -z "$(find "${site}" -maxdepth 1 -name 'dist*' -print -quit)"
          test -z "$(find "${site}" -maxdepth 1 -type f -name 'shopping-budget-companion-*.cdx.json*' -print -quit)"

  browser:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install browser-test dependencies without package install scripts
        run: npm ci --ignore-scripts

      - name: Download exact release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pages-site
          path: .playwright-site-root/shopping-budget-companion

      - name: Expose production index at test origin
        run: cp .playwright-site-root/shopping-budget-companion/index.html .playwright-site-root/index.html

      - name: Harden Ubuntu package acquisition
        shell: bash
        run: |
          sudo tee /etc/apt/apt.conf.d/80-playwright-ci-network >/dev/null <<'EOF'
          Acquire::Retries "5";
          Acquire::ForceIPv4 "true";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF

      - name: Install browser
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run production browser and accessibility tests
        env:
          PLAYWRIGHT_STAGED_SITE: "1"
        run: npm run test:e2e -- --project=${{ matrix.browser }}

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ matrix.browser }}-${{ github.run_attempt }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  guarded-browser:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install browser-test dependencies without package install scripts
        run: npm ci --ignore-scripts

      - name: Download exact release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pages-site
          path: /tmp/pages-site

      - name: Harden Ubuntu package acquisition
        shell: bash
        run: |
          sudo tee /etc/apt/apt.conf.d/80-playwright-ci-network >/dev/null <<'EOF'
          Acquire::Retries "5";
          Acquire::ForceIPv4 "true";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF

      - name: Install Chromium
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
        run: npx playwright install --with-deps chromium

      - name: Run guarded surface browser tests
        shell: bash
        env:
          PLAYWRIGHT_STAGED_SITE: "1"
          PLAYWRIGHT_GUARDED_SURFACE: "1"
          EVIDENCE_BUILD_REVISION: ${{ github.sha }}
        run: |
          set -uo pipefail
          surfaces=(
            "qa @qa"
            "beta @beta"
            "cohort @cohort"
          )
          failed=()

          for entry in "${surfaces[@]}"; do
            read -r surface tag <<<"${entry}"
            echo "::group::${surface} (${tag})"
            rm -rf .playwright-site-root
            mkdir -p .playwright-site-root/shopping-budget-companion
            cp -R /tmp/pages-site/. .playwright-site-root/shopping-budget-companion/
            cp -R "/tmp/pages-site/${surface}/." .playwright-site-root/
            PLAYWRIGHT_HTML_OUTPUT_DIR="playwright-report/${surface}" \
              npm run test:e2e -- --project=chromium --grep "${tag}" --output "test-results/${surface}" \
              || failed+=("${surface}")
            echo "::endgroup::"
          done

          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::Guarded surface browser tests failed: ${failed[*]}"
            exit 1
          fi

      - name: Upload guarded surface failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-guarded-${{ github.run_attempt }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [artifact-integrity, provenance, browser, guarded-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: true

    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download exact tested site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pages-site
          path: /tmp/pages-site

      - name: Verify deploy artifact cleanliness
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html .nojekyll manifest.webmanifest sw.js; do
            test -f "/tmp/pages-site/${file}"
          done
          for path in node_modules package.json src tests; do
            test ! -e "/tmp/pages-site/${path}"
          done

      - name: Preserve immutable study baselines
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/preserved-gh-pages
          mkdir -p /tmp/preserved-gh-pages
          git fetch origin gh-pages:refs/remotes/origin/gh-pages

          if git ls-tree -d --name-only origin/gh-pages study | grep -qx study; then
            git archive origin/gh-pages study | tar -x -C /tmp/preserved-gh-pages
            git rev-parse origin/gh-pages:study > /tmp/study-tree-before
          fi

      - name: Publish exact tested artifact to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Build the deployment commit directly on the current remote gh-pages
          # head. This keeps every production publication fast-forwardable so
          # gh-pages can reject force pushes without breaking verified deploys.
          git switch -C gh-pages-publish origin/gh-pages
          git rm -rf .
          git clean -fdx
          cp -R /tmp/pages-site/. .

          if [ -d /tmp/preserved-gh-pages/study ]; then
            cp -R /tmp/preserved-gh-pages/study ./study
          fi

          git add -A

          if [ -f /tmp/study-tree-before ]; then
            root_tree="$(git write-tree)"
            study_tree_after="$(git rev-parse "${root_tree}:study")"
            study_tree_before="$(cat /tmp/study-tree-before)"
            test "${study_tree_after}" = "${study_tree_before}"
          fi

          # Even if the tested site bytes are unchanged, retain one deployment
          # commit that records exactly which main SHA passed every release gate.
          git commit --allow-empty -m "deploy: tested shopping app ${GITHUB_SHA}"

          # Fail closed if the local deployment commit is somehow no longer a
          # descendant of the remote deployment head we fetched above.
          git merge-base --is-ancestor origin/gh-pages HEAD
          git push origin HEAD:gh-pages
