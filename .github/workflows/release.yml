name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.identity.outputs.version }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify release identity and deployed baseline
        id: identity
        shell: bash
        run: |
          set -euo pipefail

          version="$(jq -r .version package.json)"
          expected_tag="v${version}"

          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}."
            exit 1
          fi

          git fetch origin main gh-pages

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Release tag must point to a commit contained in main."
            exit 1
          fi

          deployed_source="$(
            git log -1 --format=%B origin/gh-pages |
              sed -n 's/^deploy: tested shopping app \([0-9a-f]\{40\}\)$/\1/p' |
              head -n 1
          )"

          if [ "${deployed_source}" != "${GITHUB_SHA}" ]; then
            echo "::error::Release SHA ${GITHUB_SHA} is not the exact currently deployed tested gh-pages source (${deployed_source:-unknown})."
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run complete static, unit and component gate
        run: npm run check

      - name: Verify camera kill-switch build
        env:
          VITE_SHOPPING_BARCODE_SCANNER: "0"
          VITE_SHOPPING_PRICE_OCR: "0"
          VITE_SHOPPING_VISUAL_RECOGNITION: "0"
        run: |
          npm run build
          npm run build:check

      - name: Build exact public release site
        run: |
          rm -rf dist
          npm run build -- --base=/shopping-budget-companion/
          npm run build:check

      - name: Download pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.52.0

      - name: Build release bundle and SBOM
        shell: bash
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-bundle

          tar -C dist -czf "release-bundle/shopping-budget-companion-${VERSION}.tar.gz" .
          sha256sum "release-bundle/shopping-budget-companion-${VERSION}.tar.gz"             > "release-bundle/shopping-budget-companion-${VERSION}.tar.gz.sha256"

          "${{ steps.syft.outputs.cmd }}" dir:.             --select-catalogers '-github-actions-usage-cataloger,-github-action-workflow-usage-cataloger'             --source-name shopping-budget-companion             --source-version "${VERSION}"             -o "cyclonedx-json=release-bundle/shopping-budget-companion-${VERSION}.cdx.json"

          SBOM="release-bundle/shopping-budget-companion-${VERSION}.cdx.json"
          sha256sum "${SBOM}" > "${SBOM}.sha256"

          jq -e '.bomFormat == "CycloneDX"' "${SBOM}" >/dev/null
          jq -e --arg version "${VERSION}" '.metadata.component.name == "shopping-budget-companion" and .metadata.component.version == $version' "${SBOM}" >/dev/null

          while IFS= read -r dependency; do
            jq -e --arg dependency "${dependency}" 'any(.components[]; .name == $dependency)' "${SBOM}" >/dev/null
          done < <(jq -r '.dependencies | keys[]' package.json)

          jq -e 'all(.components[]; .name != "vitest" and .name != "@vitest/coverage-v8")' "${SBOM}" >/dev/null
          jq -e '[.components[] | select((.purl // "") | startswith("pkg:github/"))] | length == 0' "${SBOM}" >/dev/null

          sha256sum --check "release-bundle/shopping-budget-companion-${VERSION}.tar.gz.sha256"
          sha256sum --check "${SBOM}.sha256"

      - name: Upload exact release site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-site
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: release-bundle
          if-no-files-found: error
          retention-days: 30

  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download exact release site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-site
          path: .playwright-site-root/shopping-budget-companion

      - name: Expose production index at test origin
        run: cp .playwright-site-root/shopping-budget-companion/index.html .playwright-site-root/index.html

      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run release browser and accessibility tests
        env:
          PLAYWRIGHT_STAGED_SITE: "1"
        run: npm run test:e2e -- --project=${{ matrix.browser }}

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-playwright-${{ matrix.browser }}-${{ github.run_attempt }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [build, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release-bundle

      - name: Verify release bundle digests
        shell: bash
        working-directory: release-bundle
        run: |
          set -euo pipefail
          sha256sum --check "shopping-budget-companion-${{ needs.build.outputs.version }}.tar.gz.sha256"
          sha256sum --check "shopping-budget-companion-${{ needs.build.outputs.version }}.cdx.json.sha256"

      - name: Publish immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::error::GitHub Release ${GITHUB_REF_NAME} already exists; releases are immutable."
            exit 1
          fi

          gh release create "${GITHUB_REF_NAME}"             "release-bundle/shopping-budget-companion-${VERSION}.tar.gz"             "release-bundle/shopping-budget-companion-${VERSION}.tar.gz.sha256"             "release-bundle/shopping-budget-companion-${VERSION}.cdx.json"             "release-bundle/shopping-budget-companion-${VERSION}.cdx.json.sha256"             --verify-tag             --title "Shopping Budget Companion ${GITHUB_REF_NAME}"             --generate-notes
