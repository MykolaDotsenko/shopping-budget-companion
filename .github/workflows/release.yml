name: Publish GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact package version to release, for example 2.0.0"
        required: true
        type: string
      source_sha:
        description: "Exact successful main commit SHA to release"
        required: true
        type: string
      quality_run_id:
        description: "Successful main Quality push run that deployed this SHA"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Validate local release contract
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          QUALITY_RUN_ID: ${{ inputs.quality_run_id }}
        run: node scripts/validate-release-contract.mjs

      - name: Validate current main and successful Quality provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          QUALITY_RUN_ID: ${{ inputs.quality_run_id }}
        run: |
          set -euo pipefail

          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(git rev-parse origin/main)" = "${SOURCE_SHA}"

          tag="v${RELEASE_VERSION}"
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            echo "Release tag already exists: ${tag}" >&2
            exit 1
          fi

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub Release already exists: ${tag}" >&2
            exit 1
          fi

          run_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${QUALITY_RUN_ID}")"

          jq -e --arg sha "${SOURCE_SHA}" '
            .name == "Quality" and
            .event == "push" and
            .head_branch == "main" and
            .head_sha == $sha and
            .status == "completed" and
            .conclusion == "success"
          ' <<<"${run_json}" >/dev/null

      - name: Download exact tested Pages artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pages-site
          path: /tmp/pages-site
          github-token: ${{ github.token }}
          run-id: ${{ inputs.quality_run_id }}

      - name: Download exact SBOM evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-${{ inputs.source_sha }}
          path: /tmp/sbom
          github-token: ${{ github.token }}
          run-id: ${{ inputs.quality_run_id }}

      - name: Verify release evidence
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail

          for file in index.html manifest.webmanifest sw.js pwa-icon-192.png pwa-icon-512.png; do
            test -f "/tmp/pages-site/${file}"
          done

          for surface in qa beta cohort; do
            test -f "/tmp/pages-site/${surface}/index.html"
            test ! -e "/tmp/pages-site/${surface}/sw.js"
          done

          sbom="/tmp/sbom/shopping-budget-companion-${SOURCE_SHA}.cdx.json"
          sidecar="${sbom}.sha256"
          test -f "${sbom}"
          test -f "${sidecar}"
          (cd /tmp/sbom && sha256sum --check "$(basename "${sidecar}")")

          archive="/tmp/shopping-budget-companion-v${RELEASE_VERSION}-pages-site.tar.gz"
          tar -C /tmp/pages-site -czf "${archive}" .
          sha256sum "${archive}" > "${archive}.sha256"

      - name: Create verified GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          QUALITY_RUN_ID: ${{ inputs.quality_run_id }}
        run: |
          set -euo pipefail

          tag="v${RELEASE_VERSION}"
          archive="/tmp/shopping-budget-companion-${tag}-pages-site.tar.gz"
          sbom="/tmp/sbom/shopping-budget-companion-${SOURCE_SHA}.cdx.json"

          cat > /tmp/release-notes.md <<EOF
          ## Verified release provenance

          - Source commit: \`${SOURCE_SHA}\`
          - Quality run: \`${QUALITY_RUN_ID}\`
          - Production PWA: https://mykoladotsenko.github.io/shopping-budget-companion/
          - Release artifact: exact tested Pages artifact from the successful main Quality run
          - Supply-chain evidence: CycloneDX SBOM + SHA-256 sidecars

          This GitHub Release records an engineering artifact and its provenance. Human retention or real-store camera validation claims remain governed by the repository evidence gates and are not implied by the release tag.
          EOF

          gh release create "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${SOURCE_SHA}" \
            --title "Shopping Budget Companion ${tag}" \
            --notes-file /tmp/release-notes.md \
            "${archive}" \
            "${archive}.sha256" \
            "${sbom}" \
            "${sbom}.sha256"

          gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json tagName,targetCommitish,url
