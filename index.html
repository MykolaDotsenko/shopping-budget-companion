<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1eb" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="Shopping Budget Companion" />
    <meta
      name="description"
      content="Set a shopping limit, add prices as you go and always see what’s left before checkout. No account, no bank connection, works offline once opened."
    />
    <link rel="canonical" href="https://mykoladotsenko.github.io/shopping-budget-companion/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shopping Budget Companion" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:title" content="Know what’s left before checkout" />
    <meta
      property="og:description"
      content="Set a shopping limit, add prices as you go and always see what’s left before checkout. No account, no bank connection, works offline once opened."
    />
    <meta property="og:url" content="https://mykoladotsenko.github.io/shopping-budget-companion/" />
    <meta property="og:image" content="https://mykoladotsenko.github.io/shopping-budget-companion/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Shopping Budget Companion trip screen showing €19.48 left of a €50 budget."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="apple-mobile-web-app-title" content="Shop Budget" />
    <script>
      (() => {
        const key = "shopping-budget:appearance";
        const allowed = ["system", "light", "dark", "aurora"];
        let mode = "system";

        try {
          const stored = localStorage.getItem(key);

          if (allowed.includes(stored)) {
            mode = stored;
          }
        } catch {
          // Appearance persistence is convenience-only. Rendering must continue.
        }

        document.documentElement.dataset.appearance = mode;

        const prefersDark =
          typeof matchMedia === "function" &&
          matchMedia("(prefers-color-scheme: dark)").matches;
        const resolved =
          mode === "system" ? (prefersDark ? "dark" : "light") : mode;

        document.documentElement.dataset.theme = resolved;

        const colors = {
          light: "#f4f1eb",
          dark: "#0f1210",
          aurora: "#070912",
        };
        const themeMeta = document.querySelector('meta[name="theme-color"]');

        themeMeta?.setAttribute("content", colors[resolved] ?? colors.light);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Shopping Budget Companion — know what’s left before checkout</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
