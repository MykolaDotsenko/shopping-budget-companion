<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="https://mykoladotsenko.github.io/shopping-budget-companion/favicon.svg" />
    <title>Page not found — Shopping Budget Companion</title>
    <style>
      :root {
        --page: #f4f1eb;
        --text: #1d241f;
        --muted: #5f675f;
        --accent: #2f604f;
        --accent-contrast: #ffffff;
        --focus: #225fc4;
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: #0f1210;
          --text: #f3f5f1;
          --muted: #c5cdc6;
          --accent: #8fd4b7;
          --accent-contrast: #0d2018;
          --focus: #a6c6ff;
          color-scheme: dark;
        }
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        box-sizing: border-box;
        background: var(--page);
        color: var(--text);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.8rem, 7vw, 2.4rem);
        letter-spacing: -0.03em;
      }

      p {
        margin: 0 0 28px;
        color: var(--muted);
        line-height: 1.5;
      }

      a {
        display: inline-block;
        min-height: 48px;
        padding: 12px 24px;
        box-sizing: border-box;
        border-radius: 16px;
        background: var(--accent);
        color: var(--accent-contrast);
        font-weight: 800;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>This page doesn’t exist</h1>
      <p>The link may be old or mistyped. Your trips are safe in the app.</p>
      <a href="https://mykoladotsenko.github.io/shopping-budget-companion/">Open Shopping Budget Companion</a>
    </main>
  </body>
</html>
