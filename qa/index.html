    <script>
      (() => {
        const key = "shopping-budget:language";
        const allowed = ["en", "fi", "uk"];
        let language = "en";

        try {
          const stored = localStorage.getItem(key);

          if (allowed.includes(stored)) {
            language = stored;
          } else {
            const detected = (navigator.languages ?? [navigator.language])
              .map((value) => value.toLowerCase().split("-")[0])
              .find((value) => value === "fi" || value === "uk");

            if (detected) {
              language = detected;
            }
          }
        } catch {
          // Language preference is convenience-only. Rendering must continue.
        }

        document.documentElement.lang = language;
      })();
    </script>
    <script>
      (() => {
        const key = "shopping-budget:appearance";
        const allowed = ["system", "light", "dark", "aurora"];
        let mode = "system";

        try {
          const stored = localStorage.getItem(key);

          if (allowed.includes(stored)) {
            mode = stored;
          }
        } catch {
          // Appearance persistence is convenience-only. Rendering must continue.
        }

        document.documentElement.dataset.appearance = mode;

        const prefersDark =
          typeof matchMedia === "function" &&
          matchMedia("(prefers-color-scheme: dark)").matches;
        const resolved =
          mode === "system" ? (prefersDark ? "dark" : "light") : mode;

        document.documentElement.dataset.theme = resolved;

        const colors = {
          light: "#f4f1eb",
          dark: "#0f1210",
          aurora: "#070912",
        };
        const themeMeta = document.querySelector('meta[name="theme-color"]');

        themeMeta?.setAttribute("content", colors[resolved] ?? colors.light);
      })();
    </script>
